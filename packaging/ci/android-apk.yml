# Draft GitHub Actions workflow for Android APK.
# If OAuth lacks workflow scope, keep this under packaging/ci/ and copy to
# .github/workflows/android-apk.yml with a token that can push workflows.
name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'docs/android-*.md', 'packaging/ci/android-apk.yml']
  pull_request:
    paths: ['android/**']
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Assemble debug
        working-directory: android
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: birdy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
