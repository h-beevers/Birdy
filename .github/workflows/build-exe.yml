name: Build Windows exe

# Builds Birdy.exe on a Windows runner so nobody needs Python installed to
# use it. Runs on every push/PR that touches the app (as a smoke test —
# artifact only, no release), and additionally publishes a GitHub Release
# with the exe attached when a version tag (v*) is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "birdweather_local.py"
      - "birdy.spec"
      - "requirements.txt"
      - "Illustrations/**"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "birdweather_local.py"
      - "birdy.spec"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Birdy.exe
        run: pyinstaller birdy.spec

      - name: Confirm the build produced an exe
        run: |
          if (-not (Test-Path "dist\Birdy.exe")) { throw "dist\Birdy.exe was not produced" }
          Get-Item "dist\Birdy.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Birdy-windows
          path: dist/Birdy.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Birdy.exe
          generate_release_notes: true
